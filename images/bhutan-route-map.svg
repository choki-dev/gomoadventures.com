<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="mapTitle">
  <title id="mapTitle">Bhutan Kingdom of Fungi route map: Paro, Thimphu, Punakha, Trongsa and Bumthang</title>

  <!-- sky / surrounding backdrop -->
  <rect x="0" y="0" width="480" height="360" fill="#e7f0f5" />

  <!-- country label -->
  <text x="410" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700"
    letter-spacing="2" fill="#9aa5ab">BHUTAN</text>

  <!-- Himalayan ridge hint (north border) -->
  <path d="M40,150 L58,136 L75,148 L95,132 L118,146 L142,128 L168,142 L196,124 L226,140 L258,122 L292,138 L328,120 L366,136 L404,118 L432,132"
    fill="none" stroke="#b9c6cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- simplified landmass -->
  <path
    d="M46,182 C56,158 78,138 108,132 C130,128 146,142 168,140 C196,138 210,116 240,118 C268,120 276,144 302,146 C332,148 356,132 386,140 C414,148 434,168 438,196 C441,220 424,238 402,250 C378,264 350,254 326,262 C300,270 284,290 256,292 C228,294 214,276 188,278 C160,280 148,298 122,296 C96,294 80,276 66,254 C52,232 38,210 46,182 Z"
    fill="#f4e8c8" stroke="#d9c48d" stroke-width="1.5" stroke-linejoin="round" />

  <!-- subtle terrain texture -->
  <path d="M100,190 q20,-14 40,0 M180,170 q20,-12 40,0 M260,180 q20,-12 40,0 M330,190 q18,-12 36,0"
    fill="none" stroke="#e4d3a3" stroke-width="1.5" stroke-linecap="round" />

  <!-- return route (Bumthang back to Paro) -->
  <path d="M366,196 C320,238 250,258 176,246 C140,240 108,232 92,222"
    fill="none" stroke="#C1662E" stroke-width="2" stroke-dasharray="7,6" stroke-linecap="round" opacity="0.5" />

  <!-- outbound route (Paro through Bumthang) -->
  <path d="M92,222 C118,206 138,208 150,202 C168,194 178,190 196,186 C220,180 234,180 250,182 C280,186 300,182 320,188 C340,194 352,192 366,196"
    fill="none" stroke="#C1662E" stroke-width="2.75" stroke-dasharray="7,6" stroke-linecap="round" />

  <!-- Thimphu -->
  <circle cx="150" cy="202" r="5.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
  <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Thimphu</text>

  <!-- Punakha -->
  <circle cx="196" cy="186" r="5.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
  <text x="196" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Punakha</text>

  <!-- Trongsa -->
  <circle cx="270" cy="184" r="5.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
  <text x="270" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3a3a3a">Trongsa</text>

  <!-- Bumthang -->
  <circle cx="366" cy="196" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2" />
  <text x="366" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a">Bumthang</text>

  <!-- Paro: start / end -->
  <circle cx="92" cy="222" r="11" fill="#C1662E" />
  <text x="92" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">S/E</text>
  <text x="92" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">Paro</text>
</svg>
